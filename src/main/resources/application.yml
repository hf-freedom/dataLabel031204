server:
  port: 17543

spring:
  application:
    name: excel-preview-plugin
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB
  thymeleaf:
    cache: false
    mode: HTML
    encoding: UTF-8
    prefix: classpath:/templates/
    suffix: .html

# Excel配置
excel:
  template:
    path: config/
  cache:
    expire-minutes: 30

logging:
  level:
    com.example.excel: debug
