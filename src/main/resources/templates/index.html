<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excel数据导入系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .card-title {
            font-size: 1.5em;
            color: #333;
            margin-bottom: 20px;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }

        .template-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .template-item {
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            padding: 20px;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .template-item:hover {
            border-color: #667eea;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.2);
        }

        .template-item h3 {
            color: #667eea;
            margin-bottom: 10px;
        }

        .template-item p {
            color: #666;
            font-size: 0.9em;
            margin-bottom: 15px;
        }

        .btn {
            display: inline-block;
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s ease;
            text-decoration: none;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-success {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
        }

        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(17, 153, 142, 0.4);
        }

        .upload-area {
            border: 3px dashed #ccc;
            border-radius: 12px;
            padding: 60px 40px;
            text-align: center;
            transition: all 0.3s ease;
            background: #fafafa;
        }

        .upload-area:hover {
            border-color: #667eea;
            background: #f0f4ff;
        }

        .upload-area.dragover {
            border-color: #667eea;
            background: #e8edff;
        }

        .upload-icon {
            font-size: 4em;
            color: #667eea;
            margin-bottom: 20px;
        }

        .upload-text {
            font-size: 1.2em;
            color: #666;
            margin-bottom: 20px;
        }

        .file-input {
            display: none;
        }

        .alert {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 40px;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .features {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .feature {
            text-align: center;
            padding: 20px;
        }

        .feature-icon {
            font-size: 3em;
            margin-bottom: 15px;
        }

        .feature h4 {
            color: #333;
            margin-bottom: 10px;
        }

        .feature p {
            color: #666;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 Excel数据导入系统</h1>
            <p>支持用户和机构数据的批量导入、预览和编辑</p>
        </div>

        <div id="alertBox" class="alert"></div>

        <div class="card">
            <h2 class="card-title">📥 第一步：下载模板</h2>
            <div class="template-list" id="templateList">
                <div class="template-item">
                    <h3>👤 用户导入模板</h3>
                    <p>用于批量导入用户信息，包含用户名、手机号、邮箱等字段</p>
                    <button class="btn btn-primary" onclick="downloadTemplate('USER_TEMPLATE_001')">
                        下载模板
                    </button>
                </div>
                <div class="template-item">
                    <h3>🏢 机构导入模板</h3>
                    <p>用于批量导入机构信息，包含机构编码、名称、联系方式等字段</p>
                    <button class="btn btn-primary" onclick="downloadTemplate('ORG_TEMPLATE_001')">
                        下载模板
                    </button>
                </div>
            </div>
        </div>

        <div class="card">
            <h2 class="card-title">📤 第二步：上传Excel</h2>
            <div class="upload-area" id="uploadArea">
                <div class="upload-icon">📁</div>
                <div class="upload-text">
                    拖拽Excel文件到此处，或 <span style="color: #667eea; cursor: pointer;">点击选择文件</span>
                </div>
                <input type="file" id="fileInput" class="file-input" accept=".xlsx,.xls">
            </div>
            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>正在解析Excel文件，请稍候...</p>
            </div>
        </div>

        <div class="card">
            <h2 class="card-title">✨ 系统功能</h2>
            <div class="features">
                <div class="feature">
                    <div class="feature-icon">📋</div>
                    <h4>模板下载</h4>
                    <p>提供标准化的Excel导入模板</p>
                </div>
                <div class="feature">
                    <div class="feature-icon">👁️</div>
                    <h4>数据预览</h4>
                    <p>上传后可预览所有数据内容</p>
                </div>
                <div class="feature">
                    <div class="feature-icon">✏️</div>
                    <h4>在线编辑</h4>
                    <p>支持修改和删除数据行</p>
                </div>
                <div class="feature">
                    <div class="feature-icon">✅</div>
                    <h4>数据校验</h4>
                    <p>自动校验数据格式和完整性</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const loading = document.getElementById('loading');
        const alertBox = document.getElementById('alertBox');

        uploadArea.addEventListener('click', () => fileInput.click());

        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                handleFile(files[0]);
            }
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFile(e.target.files[0]);
            }
        });

        function handleFile(file) {
            const validTypes = [
                'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',
                'application/vnd.ms-excel'
            ];

            if (!validTypes.includes(file.type) && !file.name.endsWith('.xlsx') && !file.name.endsWith('.xls')) {
                showAlert('请选择Excel文件（.xlsx或.xls格式）', 'error');
                return;
            }

            uploadFile(file);
        }

        function uploadFile(file) {
            const formData = new FormData();
            formData.append('file', file);

            uploadArea.style.display = 'none';
            loading.style.display = 'block';

            fetch('/api/preview/upload', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                loading.style.display = 'none';
                uploadArea.style.display = 'block';

                if (data.success) {
                    showAlert('上传成功！正在跳转到预览页面...', 'success');
                    setTimeout(() => {
                        window.location.href = '/preview?taskId=' + data.data.taskId;
                    }, 1000);
                } else {
                    showAlert(data.message || '上传失败', 'error');
                }
            })
            .catch(error => {
                loading.style.display = 'none';
                uploadArea.style.display = 'block';
                showAlert('上传失败: ' + error.message, 'error');
            });
        }

        function downloadTemplate(templateId) {
            window.location.href = '/api/template/download/' + templateId;
        }

        function showAlert(message, type) {
            alertBox.textContent = message;
            alertBox.className = 'alert alert-' + type;
            alertBox.style.display = 'block';
            setTimeout(() => {
                alertBox.style.display = 'none';
            }, 5000);
        }
    </script>
</body>
</html>
